<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AEQUITAS — El Retorno del Equilibrio</title>
    <!-- PWA: instalable en el celular + offline -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#150f2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AEQUITAS" />
    <meta name="description" content="AEQUITAS — Aventura de rol e investigación dialéctica: restaura el equilibrio con la palabra, la prueba y la ley." />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <style>
            html, body {
        margin: 0; padding: 0; height: 100%;
        overflow: hidden;
        /* Fondo de la página: un atardecer sobre el río, del mismo tono que el menú. */
        background-color: #120d1e;
        background-image:
          radial-gradient(1.5px 1.5px at 8% 6%, rgba(255, 244, 220, 0.8) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 17% 14%, rgba(255, 244, 220, 0.5) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 26% 4%, rgba(255, 244, 220, 0.7) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 34% 19%, rgba(255, 244, 220, 0.4) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 43% 9%, rgba(255, 244, 220, 0.8) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 52% 3%, rgba(255, 244, 220, 0.5) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 61% 16%, rgba(255, 244, 220, 0.6) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 70% 7%, rgba(255, 244, 220, 0.8) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 78% 21%, rgba(255, 244, 220, 0.4) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 86% 11%, rgba(255, 244, 220, 0.7) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 94% 5%, rgba(255, 244, 220, 0.5) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 12% 26%, rgba(255, 244, 220, 0.3) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 57% 27%, rgba(255, 244, 220, 0.3) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 90% 28%, rgba(255, 244, 220, 0.3) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 39% 31%, rgba(255, 244, 220, 0.25) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 73% 33%, rgba(255, 244, 220, 0.25) 50%, transparent 51%),
          radial-gradient(ellipse 70% 45% at 50% 55%, rgba(240, 144, 96, 0.22), transparent 70%),
          radial-gradient(ellipse 120% 60% at 50% 110%, rgba(36, 20, 40, 0.95), transparent 70%),
          linear-gradient(180deg, #150f2a 0%, #3a1e3e 42%, #5a2a4a 58%, #241428 78%, #120d1e 100%);
        background-attachment: fixed;
        font-family: system-ui, sans-serif;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #stage { position: relative; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
      #game { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
      /* El lienzo ya viene casi a la resolución de la pantalla (src/systems/view.js);
         el ajuste final se suaviza para que las letras no salgan en escalones. */
      canvas { display: block; box-shadow: 0 0 0 1px rgba(227, 176, 75, 0.35), 0 0 40px rgba(240, 160, 100, 0.25), 0 10px 40px rgba(0, 0, 0, 0.6); }

      #pad, #band { display: none; }

      /* ===== Palanca: un pozo oscuro con aro de bronce ===== */
      #joy-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; transition: opacity .25s; }
      #joy-wrap.off { opacity: .3; }
      #joy {
        position: relative; width: 34vmin; height: 34vmin; max-width: 170px; max-height: 170px;
        border-radius: 50%; touch-action: none; flex: 0 0 auto;
        background: radial-gradient(circle at 50% 42%, #2e2140, #120c1a 78%);
        border: 3px solid #8a6a32;
        box-shadow: inset 0 6px 16px rgba(0,0,0,.7), 0 0 0 2px #1a1020, 0 6px 14px rgba(0,0,0,.45);
        transition: border-color .15s, box-shadow .15s;
      }
      #joy.on { border-color: #e3b04b; box-shadow: inset 0 6px 16px rgba(0,0,0,.7), 0 0 0 2px #1a1020, 0 0 18px rgba(227,176,75,.35); }
      #joy i { position: absolute; width: 0; height: 0; border: 6px solid transparent; opacity: .55; }
      #joy i.n { top: 7%; left: 50%; transform: translateX(-50%); border-bottom: 8px solid #c9a24f; border-top: 0; }
      #joy i.s { bottom: 7%; left: 50%; transform: translateX(-50%); border-top: 8px solid #c9a24f; border-bottom: 0; }
      #joy i.w { left: 7%; top: 50%; transform: translateY(-50%); border-right: 8px solid #c9a24f; border-left: 0; }
      #joy i.e { right: 7%; top: 50%; transform: translateY(-50%); border-left: 8px solid #c9a24f; border-right: 0; }
      #joy-thumb {
        position: absolute; left: 50%; top: 50%; width: 42%; height: 42%;
        transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(circle at 38% 30%, #fff2c8, #e3b04b 45%, #9a7230 100%);
        border: 2px solid #4a3418; box-shadow: 0 5px 10px rgba(0,0,0,.55), inset 0 -3px 4px rgba(0,0,0,.25);
        pointer-events: none;
      }
      .cap { font: 600 10px/1 Georgia, serif; letter-spacing: 1.5px; text-transform: uppercase; color: #c9b98a; min-height: 10px; }

      /* ===== Botones: teclas de pergamino; el rótulo cambia con la pantalla ===== */
      #btns {
        display: grid; grid-template-columns: repeat(3, 14.5vmin); grid-template-rows: repeat(3, 14.5vmin);
        place-items: center; flex: 0 0 auto;
      }
      .k-c { grid-area: 1 / 2; } .k-b { grid-area: 2 / 1; } .k-x { grid-area: 2 / 3; } .k-e { grid-area: 3 / 2; }
      .btn {
        --c: #6cc77a;
        position: relative; box-sizing: border-box;
        width: 14vmin; height: 14vmin; max-width: 66px; max-height: 66px;
        border-radius: 50%; border: 2px solid rgba(74,48,26,.7);
        background: radial-gradient(circle at 40% 30%, #fffaf0, #efe3c2 55%, #cdb88a 100%);
        color: var(--c); font: 700 5.6vmin/1 Georgia, serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
        box-shadow: 0 4px 0 #6e4a2a, 0 6px 8px rgba(0,0,0,.45), inset 0 1px 0 #fff;
        touch-action: none; transition: opacity .2s, filter .2s, transform .05s;
      }
      .btn span { text-shadow: 0 1px 0 rgba(255,255,255,.7); filter: brightness(.8) saturate(1.2); }
      .btn small { font: 400 2.2vmin/1 Georgia, serif; color: #4a3a28; white-space: nowrap; }
      .btn.down { transform: translateY(3px); box-shadow: 0 1px 0 #6e4a2a, 0 2px 3px rgba(0,0,0,.4), inset 0 2px 5px rgba(0,0,0,.25); }
      .btn.big { width: 18vmin; height: 18vmin; max-width: 84px; max-height: 84px; font-size: 7vmin; }
      .btn.off { opacity: .32; filter: grayscale(.7); }
      .btn.lit::after {
        content: ""; position: absolute; inset: -6px; border-radius: 50%;
        border: 2px solid #ffe070; box-shadow: 0 0 14px #ffe070; animation: pulse 1s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
      /* Expediente y Menú: botones de sistema, como Select y Start. */
      #sys { display: flex; flex-direction: column; gap: 10px; align-items: center; }
      .btn.pill {
        width: auto; height: 30px; max-width: none; max-height: none; border-radius: 999px; padding: 0 12px;
        flex-direction: row; gap: 6px; font-size: 15px;
        background: linear-gradient(#3a2a48, #261a32); border: 1px solid #8a6a32; box-shadow: 0 3px 0 #120c1a, 0 4px 6px rgba(0,0,0,.4);
      }
      .btn.pill span { filter: none; text-shadow: none; }
      .btn.pill small { color: #e8dccc; font-size: 12px; }
      .btn.pill.down { box-shadow: 0 1px 0 #120c1a; }

      /* ===== VERTICAL: juego arriba, panel de estado, consola abajo ===== */
      @media (pointer: coarse) and (orientation: portrait) {
        #stage { padding-top: env(safe-area-inset-top); box-sizing: border-box; }
        #game { flex: 0 0 auto; height: calc(100vw * 9 / 16); margin-top: 6px; }
        canvas { box-shadow: 0 0 0 1px rgba(227, 176, 75, 0.55), 0 8px 24px rgba(0, 0, 0, 0.55); }
        #band {
          display: flex; flex: 1 1 auto; min-height: 0; flex-direction: column; justify-content: flex-start; gap: 10px;
          margin: 12px 12px 10px; padding: 12px 16px; box-sizing: border-box; overflow: hidden;
          border-radius: 12px; border: 1px solid rgba(227,176,75,.35);
          background: linear-gradient(180deg, rgba(20,14,32,.82), rgba(12,9,20,.9));
          box-shadow: inset 0 1px 0 rgba(255,240,200,.08), 0 6px 18px rgba(0,0,0,.35);
          font-family: Georgia, serif; color: #efe3c2;
        }
        #band .myst { color: #e3b04b; font-style: italic; font-size: 16px; line-height: 1.3; }
        #band .obj { font-size: 16px; line-height: 1.35; }
        #band .tip { font-style: italic; font-size: 15px; line-height: 1.4; color: #d8cdb8; }
        #band .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font: 13px system-ui, sans-serif; color: #c9b98a; }
        #band .bar { width: 34%; height: 7px; border-radius: 4px; background: #05080a; border: 1px solid rgba(227,176,75,.4); overflow: hidden; }
        #band .bar i { display: block; height: 100%; transition: width .6s; }
        #band .meta b { color: #ffe9a0; }
        #band .chips { display: flex; gap: 10px; margin-left: auto; }
        #band .dlg { display: flex; gap: 12px; align-items: flex-start; animation: rise .25s ease-out; }
        #band .dlg.n1 { animation-name: rise1; }
        #band .face { flex: 0 0 64px; height: 64px; border-radius: 10px; background: #1c2a2e; border: 1px solid rgba(227,176,75,.4); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
        #band .face img { height: 58px; image-rendering: pixelated; }
        #band .who { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        #band .say { font-size: 18px; line-height: 1.45; color: #f5f1e4; }
        #band .say.ok { color: #9be8a6; }
        #band .idx { font: 400 12px system-ui, sans-serif; color: #9a8ab0; }
        #band .tip b { color: #e3b04b; font-style: normal; }
        #band .say.narr { font-style: italic; color: #e8dcc4; }
        #band .next { margin-top: auto; text-align: right; font: 12px Georgia, serif; color: #e3b04b; animation: blink 1.2s ease-in-out infinite; }
        #band .last { margin-top: 4px; padding: 10px 12px; border-radius: 8px; background: rgba(239,227,194,.06); border-left: 3px solid #e3b04b; font-size: 14px; line-height: 1.4; color: #d8cdb8; }
        #band .last b { display: block; font: 600 11px Georgia, serif; letter-spacing: 1px; text-transform: uppercase; color: #c9a24f; margin-bottom: 4px; }
        @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        @keyframes rise1 { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        @keyframes blink { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
        #band .rot { margin-top: auto; font: italic 11px Georgia, serif; color: #8f7fa6; text-align: center; }
        #pad {
          display: grid; flex: 0 0 auto; height: clamp(250px, 36vh, 340px);
          grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; grid-template-areas: "sys sys" "joy btns";
          align-items: center; justify-items: center; row-gap: 4px;
          padding: 22px 8px calc(10px + env(safe-area-inset-bottom)); box-sizing: border-box; position: relative;
          background: linear-gradient(180deg, #2b1c38 0%, #1d1428 55%, #150f1f 100%);
          border-top: 1px solid rgba(227,176,75,.55);
          box-shadow: inset 0 2px 0 rgba(255,236,190,.08), 0 -8px 24px rgba(0,0,0,.35);
          border-radius: 18px 18px 0 0;
        }
        #joy-wrap { grid-area: joy; } #btns { grid-area: btns; }
        #sys { grid-area: sys; flex-direction: row; gap: 12px; }
        #pad::before {
          content: "⚖  A E Q U I T A S"; position: absolute; top: 6px; left: 0; right: 0; text-align: center;
          font: 10px Georgia, serif; letter-spacing: 2px; color: rgba(201,162,79,.55);
        }
      }

      /* ===== Pantalla de carga (HTML/CSS, hasta que Phaser arranca) ===== */
      #loader {
        position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px;
        background: radial-gradient(ellipse 70% 45% at 50% 55%, rgba(240, 144, 96, 0.25), transparent 70%), linear-gradient(180deg, #150f2a 0%, #3a1e3e 45%, #5a2a4a 60%, #120d1e 100%);
        color: #f3efe0; font-family: Georgia, serif; transition: opacity .5s ease;
      }
      #loader.hide { opacity: 0; pointer-events: none; }
      .loader-leaf { font-size: 42px; animation: bob 1.6s ease-in-out infinite; }
      .loader-title { font-size: 32px; letter-spacing: 6px; color: #e3b04b; text-shadow: 0 0 12px #f5d48a; }
      .loader-sub { font-size: 12px; color: #9fd3cf; font-style: italic; }
      .loader-bar { width: 140px; height: 4px; border-radius: 2px; background: #16303a; overflow: hidden; margin-top: 6px; }
      .loader-bar i { display: block; width: 40%; height: 100%; background: #e3b04b; animation: slide 1.1s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }

      /* ===== HORIZONTAL: pantalla completa + botones translúcidos encima ===== */
      @media (pointer: coarse) and (orientation: landscape) {
        #pad { display: block; position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        #joy-wrap { position: absolute; left: 3vmin; bottom: 3vmin; opacity: .6; }
        #joy-wrap .cap { display: none; }
        #joy { width: 30vmin; height: 30vmin; }
        #btns { position: absolute; right: 3vmin; bottom: 2vmin; opacity: .7; grid-template-columns: repeat(3, 13vmin); grid-template-rows: repeat(3, 13vmin); }
        #btns .btn { width: 11.5vmin; height: 11.5vmin; font-size: 5vmin; }
        #btns .btn.big { width: 14.5vmin; height: 14.5vmin; font-size: 6.4vmin; }
        #btns .btn small { display: none; }
        /* Expediente y Menú: redondos, al costado derecho, sin tapar el HUD de arriba. */
        #sys { position: absolute; top: 30vh; right: 2vmin; flex-direction: column; gap: 3vmin; opacity: .7; }
        #sys .btn.pill { width: 11vmin; height: 11vmin; padding: 0; border-radius: 50%; justify-content: center; font-size: 5vmin; }
        #sys .btn.pill small { display: none; }
        #joy-wrap, #btns .btn, #sys .btn { pointer-events: auto; }
        /* Aquí sí tapan el juego: en las pantallas que se manejan tocando (menús,
           diálogos, audiencia, acuerdo...) palanca y botones se apartan; el menú sigue. */
        #pad.tap-only #joy-wrap, #pad.tap-only #btns, #pad.tap-only .k-i { visibility: hidden; pointer-events: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="game"></div>
      <div id="band"></div>
      <div id="pad"></div>
    </div>
    <div id="loader">
      <div class="loader-leaf">⚖️</div>
      <div class="loader-title">AEQUITAS</div>
      <div class="loader-sub">El Retorno del Equilibrio</div>
      <div class="loader-bar"><i></i></div>
      <div class="loader-ver" style="font-family:monospace;font-size:10px;color:#6f9a9f;margin-top:8px;opacity:.8;"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
