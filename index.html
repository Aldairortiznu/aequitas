<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AEQUITAS — El Retorno del Equilibrio</title>
    <!-- PWA: instalable en el celular + offline -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0d1820" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AEQUITAS" />
    <meta name="description" content="AEQUITAS — Aventura de rol e investigación dialéctica: restaura el equilibrio con la palabra, la prueba y la ley." />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <style>
      :root { --pad-h: 38vh; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0d1820; overflow: hidden;
        font-family: system-ui, sans-serif;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #stage { position: relative; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
      #game { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

      #pad { display: none; }

      /* ===== Joystick (palanca) de movimiento ===== */
      #joy {
        position: relative; width: 36vmin; height: 36vmin; max-width: 200px; max-height: 200px;
        border-radius: 50%; touch-action: none; flex: 0 0 auto;
        background: radial-gradient(circle at 50% 38%, #2c322a, #14170f 80%);
        border: 2px solid #0e110b; box-shadow: inset 0 5px 14px rgba(0,0,0,.65), inset 0 -2px 0 #3a4034;
      }
      #joy::after { /* guía sutil de cruz */
        content: ""; position: absolute; inset: 18%; border-radius: 50%;
        border: 1px dashed rgba(255,255,255,.08);
      }
      #joy-thumb {
        position: absolute; left: 50%; top: 50%; width: 44%; height: 44%;
        transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(circle at 40% 32%, #7a8570, #343b2c 70%, #20251c 100%);
        border: 1px solid #0b0e08; box-shadow: 0 4px 8px rgba(0,0,0,.55), inset 0 2px 3px rgba(255,255,255,.22);
        pointer-events: none;
      }

      /* ===== Botones clásicos (keycap) con la letra de PC ===== */
      #btns { display: grid; grid-template-columns: repeat(4, auto); gap: 1.6vmin 2vmin; align-items: center; justify-items: center; }
      .btn {
        --c: #6cc77a;
        width: 12.5vmin; height: 12.5vmin; max-width: 62px; max-height: 62px;
        border-radius: 24%; border: 1px solid rgba(0,0,0,.5);
        background: linear-gradient(#f3efe2, #cdc7b3);
        color: #2a2e24; font-family: 'Courier New', monospace; font-weight: 700; font-size: 4.6vmin;
        display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
        box-shadow: 0 3px 0 #6a6452, 0 4px 5px rgba(0,0,0,.4), inset 0 1px 0 #fff;
        touch-action: none;
      }
      .btn span:first-child { color: var(--c); text-shadow: 0 1px 0 rgba(255,255,255,.6); filter: saturate(1.1) brightness(.72); }
      .btn small { font-size: 1.9vmin; font-weight: 400; color: #5a5648; margin-top: 1px; font-family: Georgia, serif; }
      .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #6a6452, inset 0 2px 5px rgba(0,0,0,.3); }
      .btn.big { width: 17vmin; height: 17vmin; max-width: 84px; max-height: 84px; font-size: 6vmin; }
      .btn.lit { box-shadow: 0 0 16px var(--c), 0 3px 0 #6a6452, 0 4px 5px rgba(0,0,0,.4), inset 0 1px 0 #fff; }
      #b-menu { font-size: 2.6vmin; }

      /* ===== VERTICAL: consola sólida debajo del juego (siempre completa) ===== */
      @media (pointer: coarse) and (orientation: portrait) {
        #pad {
          display: flex; flex: 0 0 var(--pad-h);
          align-items: center; justify-content: space-between;
          gap: 8px; padding: 14px 9px calc(8px + env(safe-area-inset-bottom)) 9px;
          box-sizing: border-box; position: relative;
          background: radial-gradient(120% 90% at 50% -10%, #3a4038 0%, #262b25 45%, #1b1f1a 100%);
          border-top: 2px solid #4a5246; box-shadow: inset 0 3px 0 #5a6354, inset 0 -40px 60px rgba(0,0,0,.45);
        }
        /* La botonera no debe desbordar: palanca más pequeña, rejilla compacta. */
        #joy { width: 26vmin; height: 26vmin; }
        #btns { gap: 1.4vmin 1.6vmin; flex: 0 0 auto; }
        .btn.big { width: 15.5vmin; height: 15.5vmin; max-width: 76px; max-height: 76px; font-size: 5.4vmin; }
        #pad::before {
          content: "A E Q U I T A S"; position: absolute; top: 7px; left: 0; right: 0; text-align: center;
          font-family: Georgia, serif; font-size: 11px; letter-spacing: 2px; color: #5a6b58; text-shadow: 0 1px 0 #0d120c;
        }
        #b-menu { position: absolute; top: 5px; right: 10px; width: 28px; height: 28px; font-size: 13px; }
      }

      /* ===== Pantalla de carga (HTML/CSS, hasta que Phaser arranca) ===== */
      #loader {
        position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px;
        background: radial-gradient(120% 120% at 50% 35%, #16303a 0%, #0d1820 70%);
        color: #f3efe0; font-family: Georgia, serif; transition: opacity .5s ease;
      }
      #loader.hide { opacity: 0; pointer-events: none; }
      .loader-leaf { font-size: 42px; animation: bob 1.6s ease-in-out infinite; }
      .loader-title { font-size: 32px; letter-spacing: 6px; color: #e3b04b; text-shadow: 0 0 12px #f5d48a; }
      .loader-sub { font-size: 12px; color: #9fd3cf; font-style: italic; }
      .loader-bar { width: 140px; height: 4px; border-radius: 2px; background: #16303a; overflow: hidden; margin-top: 6px; }
      .loader-bar i { display: block; width: 40%; height: 100%; background: #e3b04b; animation: slide 1.1s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }

      /* ===== HORIZONTAL: pantalla completa + botones translúcidos encima ===== */
      @media (pointer: coarse) and (orientation: landscape) {
        #pad { display: block; position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        #joy { position: absolute; left: 3vmin; bottom: 3vmin; width: 28vmin; height: 28vmin; opacity: .55; }
        #btns { position: absolute; right: 3vmin; bottom: 2.5vmin; opacity: .62; }
        #b-menu { position: absolute; top: 2vmin; right: 2vmin; width: 8vmin; height: 8vmin; max-width:42px; max-height:42px; opacity:.6; }
        #joy, #btns .btn, #b-menu { pointer-events: auto; }
        /* Aquí sí tapan el juego: en las pantallas que se manejan tocando (menús,
           diálogos, audiencia, acuerdo...) palanca y botones se apartan; ESC sigue. */
        #pad.tap-only #joy, #pad.tap-only #btns { visibility: hidden; pointer-events: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="game"></div>
      <div id="pad"></div>
    </div>
    <div id="loader">
      <div class="loader-leaf">⚖️</div>
      <div class="loader-title">AEQUITAS</div>
      <div class="loader-sub">El Retorno del Equilibrio</div>
      <div class="loader-bar"><i></i></div>
      <div class="loader-ver" style="font-family:monospace;font-size:10px;color:#6f9a9f;margin-top:8px;opacity:.8;"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
